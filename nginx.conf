events { worker_connections 1024; }

http {
  limit_req_zone $binary_remote_addr zone=req_limit:10m rate=10r/s;

  # Streamlit's browser client holds a WebSocket to /_stcore/stream; without this
  # map the proxy defaults to Connection: close and the socket never opens.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream backend_upstream { server backend:8000; }
  upstream frontend_upstream { server frontend:8501; }

  server {
    listen 80;
    server_name _;

    location = /healthz {
      access_log off;
      add_header Content-Type application/json always;
      return 200 '{"status":"ok"}';
    }

    location /api/ {
      limit_req zone=req_limit burst=20 nodelay;
      proxy_pass http://backend_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 300s;
    }

    location / {
      limit_req zone=req_limit burst=40 nodelay;
      proxy_pass http://frontend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 300s;
      proxy_buffering off;
    }

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  }
}

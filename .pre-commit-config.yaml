# archive/ holds dead code that no longer parses
# (design_system.py and design_system_clean.py are SyntaxError at HEAD).
# It is already excluded from the Docker build context, and CI lints only
# backend/, frontend/, tests/ - so pre-commit is scoped to match CI.
exclude: '^archive/'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix"]

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
